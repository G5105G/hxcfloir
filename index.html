<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>floir</title>
<style>
  :root{
    --ratio: 1.7777778;      /* ← 16:9，改成你内容实际宽高比，如 4:3 = 1.3333333 */
    --app-height: 100dvh;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; height:100%;
    overflow:hidden; background:#000; color:#fff;
    overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }

  /* 舞台：铺满视口，去掉安全区 */
  .stage{
    position:fixed; inset:0;
    height: var(--app-height);
    display:grid; place-items:center;
    overflow:hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen{
    border:0; display:block; background:#000;
    width:100%; height:100%;   /* JS 会精确改写，这里只是兜底 */
  }

  /* 全屏按钮 */
  #fsBtn{
    position:fixed; right:12px;
    top: calc(env(safe-area-inset-top) + 12px);
    z-index: 900;
    width:40px; height:40px; border-radius:10px;
    border:0; background:rgba(255,255,255,.18);
    color:#fff; font-size:18px; line-height:40px; text-align:center;
    padding:0; cursor:pointer;
  }

  /* 竖屏旋转提示 */
  .rotate-tip{
    position:fixed; inset:0; z-index: 1000;
    display:none;
    place-items:center;
    background:#000;
    text-align:center;
    padding: 24px;
  }
  .rotate-tip.show{ display:grid; }
  .rotate-tip .icon{
    font-size:52px; line-height:1;
    margin-bottom:18px;
    animation: rot 1.6s ease-in-out infinite;
  }
  @keyframes rot{
    0%,40%{ transform: rotate(0deg); }
    60%,100%{ transform: rotate(90deg); }
  }
  .rotate-tip p{ margin:0 0 24px; font-size:16px; color:#ddd; }
  .rotate-tip button{
    padding:10px 22px; border-radius:22px;
    border:1px solid rgba(255,255,255,.35);
    background:transparent; color:#fff; font-size:14px;
  }
</style>
</head>
<body>

  <div class="stage" id="stage">
    <iframe
      id="screen"
      class="screen"
      src="https://a2e7acb56123da293.app.workbuddy.host/?sharecode=4H43KYBJIE"
      allow="fullscreen; autoplay; gamepad; accelerometer; gyroscope"
      allowfullscreen
      scrolling="no"
    ></iframe>
  </div>

  <button id="fsBtn" aria-label="全屏">⛶</button>

  <div class="rotate-tip" id="rotateTip">
    <div>
      <div class="icon">📱</div>
      <p>请横屏获得最佳体验</p>
      <button id="skipBtn">仍然竖屏进入</button>
    </div>
  </div>

<script>
(function () {
  var RATIO = 16 / 9;   // ← 和 CSS --ratio 保持一致

  var stage     = document.getElementById('stage');
  var screen    = document.getElementById('screen');
  var rotateTip = document.getElementById('rotateTip');
  var skipBtn   = document.getElementById('skipBtn');
  var fsBtn     = document.getElementById('fsBtn');
  var skipped   = false;

  function setAppHeight() {
    document.documentElement.style.setProperty(
      '--app-height', window.innerHeight + 'px'
    );
  }

  // 按比例 contain：完整显示，不裁切
  function layout() {
    setAppHeight();

    var cs = getComputedStyle(stage);
    var padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    var padY = parseFloat(cs.paddingTop)  + parseFloat(cs.paddingBottom);

    var W = stage.clientWidth  - padX;
    var H = stage.clientHeight - padY;
    if (W <= 0 || H <= 0) return;

    var w = W, h = w / RATIO;
    if (h > H) { h = H; w = h * RATIO; }

    screen.style.width  = Math.floor(w) + 'px';
    screen.style.height = Math.floor(h) + 'px';
  }

  function updateTip() {
    var portrait = window.matchMedia('(orientation: portrait)').matches;
    rotateTip.classList.toggle('show', portrait && !skipped);
  }

  skipBtn.addEventListener('click', function () {
    skipped = true;
    updateTip();
    layout();
  });

  // 全屏：标准 + Safari 前缀，失败就忽略（不影响游戏）
  fsBtn.addEventListener('click', function () {
    var el = screen;
    try {
      if (el.requestFullscreen) {
        el.requestFullscreen().catch(function(){});
      } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
      } else if (el.webkitEnterFullscreen) {
        el.webkitEnterFullscreen();
      }
    } catch (e) {}
    setTimeout(layout, 300);
  });

  window.addEventListener('resize', function () { layout(); updateTip(); });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () { layout(); updateTip(); }, 300);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', layout);
  }

  layout();
  updateTip();
})();
</script>
</body>
</html>
